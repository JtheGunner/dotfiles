# Ghostty keybinds for Linux and other non-macOS systems. Linked to
# ~/.config/ghostty-keybinds.conf by bootstrap.sh. Keep the bound actions in sync
# with keybinds-mac.conf (tests/test-ghostty-keybinds.sh checks it).
#
# Plain `ctrl+<letter>` stays with the shell (SIGINT, EOF, readline, fzf), so the
# macOS `super` scheme maps to:
#   super+X        -> ctrl+shift+X
#   super+shift+X  -> ctrl+shift+alt+X
# Ghostty's own defaults stay active (no `keybind = clear`).

keybind = ctrl+shift+n=new_window
keybind = ctrl+shift+q=quit
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+alt+w=close_window
keybind = f11=toggle_fullscreen

keybind = ctrl+shift+t=new_tab
keybind = ctrl+page_down=next_tab
keybind = ctrl+page_up=previous_tab

keybind = ctrl+shift+physical:one=goto_tab:1
keybind = ctrl+shift+physical:two=goto_tab:2
keybind = ctrl+shift+physical:three=goto_tab:3
keybind = ctrl+shift+physical:four=goto_tab:4
keybind = ctrl+shift+physical:five=goto_tab:5
keybind = ctrl+shift+physical:six=goto_tab:6
keybind = ctrl+shift+physical:seven=goto_tab:7
keybind = ctrl+shift+physical:eight=goto_tab:8
keybind = ctrl+shift+physical:nine=goto_tab:9

keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+alt+d=new_split:down
keybind = ctrl+shift+enter=toggle_split_zoom

keybind = ctrl+shift+alt+left=goto_split:left
keybind = ctrl+shift+alt+right=goto_split:right
keybind = ctrl+shift+alt+up=goto_split:top
keybind = ctrl+shift+alt+down=goto_split:bottom

keybind = ctrl+shift+left=resize_split:left,50
keybind = ctrl+shift+right=resize_split:right,50
keybind = ctrl+shift+up=resize_split:up,50
keybind = ctrl+shift+down=resize_split:down,50

keybind = ctrl+shift+home=scroll_to_top
keybind = ctrl+shift+end=scroll_to_bottom
keybind = ctrl+shift+page_up=scroll_page_up
keybind = ctrl+shift+page_down=scroll_page_down

keybind = ctrl+shift+plus=increase_font_size:1
keybind = ctrl+shift+equal=increase_font_size:1
keybind = ctrl+shift+minus=decrease_font_size:1
keybind = ctrl+shift+zero=reset_font_size

keybind = ctrl+shift+v=paste_from_clipboard
keybind = ctrl+shift+c=copy_to_clipboard

# Shift+Enter = newline (Claude Code, zsh, REPLs). Sent as literal bytes so it
# works whether or not the kitty keyboard protocol is active.
keybind = shift+enter=text:\x1b\r

keybind = ctrl+shift+a=select_all
keybind = ctrl+shift+k=clear_screen
keybind = ctrl+shift+p=toggle_command_palette
keybind = ctrl+shift+f=write_screen_file:open

keybind = shift+left=adjust_selection:left
keybind = shift+right=adjust_selection:right
keybind = shift+up=adjust_selection:up
keybind = shift+down=adjust_selection:down
keybind = ctrl+shift+alt+page_up=adjust_selection:page_up
keybind = ctrl+shift+alt+page_down=adjust_selection:page_down
keybind = ctrl+shift+alt+end=adjust_selection:end
keybind = ctrl+shift+alt+home=adjust_selection:home

keybind = global:ctrl+shift+#=toggle_quick_terminal
keybind = global:ctrl+shift+'=toggle_quick_terminal
