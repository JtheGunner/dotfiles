name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh + shellcheck
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zsh shellcheck
          else
            brew install shellcheck
          fi
      - run: make lint
      - run: make test

  bootstrap:
    name: bootstrap (ubuntu, run twice)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner ships cargo, so omnishell would build every tool Ubuntu
      # doesn't package (starship, broot, ...) from source - far past the
      # timeout. This job tests bootstrap.sh, not those builds: hide cargo and
      # let omnishell report those modules as degraded, as on a stock machine.
      - name: Hide the preinstalled Rust toolchain
        run: |
          rm -rf "$HOME/.cargo/bin" "$HOME/.rustup"
          if command -v cargo; then echo "cargo still on PATH" >&2; exit 1; fi
      - name: bootstrap.sh (first run)
        run: ./bootstrap.sh --yes
      - name: bootstrap.sh (re-run must be idempotent)
        run: ./bootstrap.sh --yes
      - run: tests/bootstrap-smoke.sh

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact -v
