# omnishell configuration, version-controlled here and copied to
# ~/.config/omnishell/config.toml by bootstrap.sh.
#
# omnishell owns everything that is an rc *line* (plugin inits, history/
# completion options, tool activation), plus the starship prompt config it
# seeds at ~/.config/omnishell/starship.toml. Standalone config *files* (git
# config, tmux.conf, ghostty, ...) are handled by the stow packages in this repo.
#
# starship, mise, the Root Loops palette push and tmux are omnishell modules now
# (enabled below): omnishell installs those packages and adds their rc lines. The
# tmux *config file* (~/.tmux.conf) is still the ./tmux/ stow package. The
# Ghostty / Terminal.app colour themes are still rendered from ./rootloops/ -
# omnishell's root-loops module only does the OSC shell push. direnv is still
# activated from ./shell.d/60-tools.sh until we adopt its module.

[omnishell]
version = 1
shells = ["zsh", "bash"]

[modules.completion]
enabled = true

[modules.history]
enabled = true
[modules.history.options]
size = 50000

[modules.autosuggestions]
enabled = true

[modules.syntax-highlighting]
enabled = true

[modules.fzf]
enabled = true
[modules.fzf.options]
ctrl_r = true
ctrl_t = true
default_opts = "--height 40% --reverse --border"

[modules.zoxide]
enabled = true
[modules.zoxide.options]
cmd = "z"

[modules.modern-aliases]
enabled = true
[modules.modern-aliases.options]
replace = ["ls", "cat", "find"]

# Runtime version manager - `mise activate` per prompt (mode = "activate").
[modules.mise]
enabled = true

# Prompt. Seeds ~/.config/omnishell/starship.toml (a curated single-line theme,
# identical to what the old starship/ stow package shipped) on first shell start
# and points STARSHIP_CONFIG at it; omnishell never overwrites it afterwards.
[modules.starship]
enabled = true

# Push the Root Loops 16-colour palette to the terminal on shell start via
# OSC 4/10/11 (replaces shell.d/95-rootloops-term.sh). "dark" forces the dark
# variant, matching the palette that fragment always pushed.
[modules.root-loops]
enabled = true
[modules.root-loops.options]
appearance = "dark"

# Installs tmux and adds its rc lines. auto_attach (omnishell >= 0.3.1) would
# attach/create the "default" session on every interactive shell start unless
# already inside tmux - left off here, so shells start outside tmux. The ./tmux/
# stow package still owns ~/.tmux.conf.
[modules.tmux]
enabled = true
[modules.tmux.options]
session = "default"
auto_attach = false
