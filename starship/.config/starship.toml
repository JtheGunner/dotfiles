# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Classic single-line prompt: user@host:dir (git) $
# All styles use ANSI colour NAMES, so they resolve to the terminal's palette
# (Root Loops) automatically - nothing colour-hardcoded here.
add_newline = false
format = "$username$hostname$directory$git_branch$git_status$character"

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold green"
trim_at = "."
format = "[@$hostname]($style):"

[directory]
style = "bold blue"
truncation_length = 0
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"

# Noise we don't want in the prompt.
[package]
disabled = true

[docker_context]
disabled = true

[ruby]
disabled = true

[gcloud]
disabled = true
